<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TEPU - Gestione Disponibilità Turni</title>
  <style>
    :root {
      --primary-color: #0056b3;
      --secondary-color: #f4f7f6;
      --accent-color: #28a745;
      --border-color: #ccc;
      --text-color: #333;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      background-color: var(--secondary-color);
      color: var(--text-color);
    }

    header {
      background-color: var(--primary-color);
      color: white;
      padding: 1rem;
      text-align: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    header h1 {
      margin: 0;
      font-size: 1.5rem;
      cursor: pointer;
      user-select: none;
    }

    .container {
      max-width: 800px;
      margin: 1.5rem auto;
      padding: 0 1rem;
    }

    .card {
      background: white;
      padding: 1.5rem;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      margin-bottom: 1.5rem;
    }

    h2 {
      margin-top: 0;
      color: var(--primary-color);
      font-size: 1.2rem;
      border-bottom: 2px solid var(--secondary-color);
      padding-bottom: 0.5rem;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    label {
      display: block;
      margin-bottom: 0.3rem;
      font-weight: bold;
    }

    input[type="text"], select {
      width: 100%;
      padding: 0.6rem;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      box-sizing: border-box;
    }

    .grid-dates {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
      margin-top: 1rem;
    }

    .date-card {
      border: 1px solid var(--border-color);
      padding: 1rem;
      border-radius: 6px;
      background-color: #fafafa;
    }

    .date-card h3 {
      margin: 0 0 0.5rem 0;
      font-size: 1rem;
    }

    .options-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .options-group label {
      font-weight: normal;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
    }

    .btn {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 0.8rem 1.2rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: bold;
      width: 100%;
      margin-top: 1rem;
      transition: background-color 0.2s;
    }

    .btn:hover {
      background-color: #004085;
    }

    .btn-whatsapp {
      background-color: #25D366;
    }

    .btn-whatsapp:hover {
      background-color: #1eb857;
    }

    .btn-group {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .btn-group .btn {
      flex: 1;
      min-width: 140px;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: white;
      padding: 1.5rem;
      border-radius: 8px;
      max-width: 400px;
      width: 90%;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
    }

    th, td {
      border: 1px solid var(--border-color);
      padding: 0.5rem;
      text-align: left;
      font-size: 0.9rem;
    }

    th {
      background-color: var(--secondary-color);
    }
  </style>
</head>
<body>

  <header>
    <h1 id="logo">TEPU - Disponibilità Turni</h1>
  </header>

  <div class="container">
    <div class="card">
      <h2>Inserimento Disponibilità</h2>
      <div class="form-group">
        <label for="userName">Il tuo Nome e Cognome:</label>
        <input type="text" id="userName" placeholder="Es. Mario Rossi">
      </div>

      <div class="grid-dates" id="datesContainer">
        <!-- Date generate via JS -->
      </div>

      <div class="btn-group">
        <button class="btn btn-whatsapp" onclick="sendWhatsApp()">📱 Copia e Invia su WhatsApp</button>
        <button class="btn" onclick="saveLocally()">💾 Salva in Locale</button>
      </div>
    </div>

    <!-- Area Riservata Admin (Invisibile di default) -->
    <div class="card" id="adminSection" style="display: none;">
      <h2>Area Amministratore</h2>
      <button class="btn" onclick="exportData()" style="margin-bottom: 1rem;">📥 Scarica File Dati (JSON)</button>
      <div style="overflow-x: auto;">
        <table id="summaryTable">
          <thead>
            <tr>
              <th>Partecipante</th>
              <th>Data</th>
              <th>Fascia Oraria</th>
            </tr>
          </thead>
          <tbody>
            <!-- Dati admin -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal Login Admin -->
  <div class="modal" id="loginModal">
    <div class="modal-content">
      <h3>Accesso Amministratore</h3>
      <div class="form-group">
        <label for="adminPassword">Password:</label>
        <input type="password" id="adminPassword">
      </div>
      <button class="btn" onclick="checkAdminPassword()">Accedi</button>
      <button class="btn" style="background-color: #6c757d;" onclick="closeLoginModal()">Annulla</button>
    </div>
  </div>

  <script>
    // Generazione automatica dei giovedì e sabati del mese corrente
    function getTurnDays() {
      const days = [];
      const now = new Date();
      const year = now.getFullYear();
      const month = now.getMonth();
      const totalDays = new Date(year, month + 1, 0).getDate();

      for (let i = 1; i <= totalDays; i++) {
        const date = new Date(year, month, i);
        const dayOfWeek = date.getDay(); // 4 = Giovedì, 6 = Sabato
        if (dayOfWeek === 4 || dayOfWeek === 6) {
          const formattedDate = date.toLocaleDateString('it-IT', {
            weekday: 'long',
            day: 'numeric',
            month: 'long'
          });
          days.push({
            id: date.toISOString().split('T')[0],
            label: formattedDate,
            isThursday: dayOfWeek === 4
          });
        }
      }
      return days;
    }

    // Rendering dei giorni nel form
    function renderDays() {
      const container = document.getElementById('datesContainer');
      const days = getTurnDays();
      
      container.innerHTML = days.map(day => `
        <div class="date-card">
          <h3>${day.label}</h3>
          <div class="options-group">
            ${day.isThursday ? `
              <label><input type="checkbox" name="${day.id}" value="Mattina (9:00-12:00)"> Mattina (9:00 - 12:00)</label>
              <label><input type="checkbox" name="${day.id}" value="Pomeriggio (15:00-18:00)"> Pomeriggio (15:00 - 18:00)</label>
            ` : `
              <label><input type="checkbox" name="${day.id}" value="Mattina (9:00-13:00)"> Mattina (9:00 - 13:00)</label>
            `}
          </div>
        </div>
      `).join('');
    }

    // Genera il testo per WhatsApp
    function generateText() {
      const name = document.getElementById('userName').value.trim();
      if (!name) {
        alert('Inserisci il tuo nome prima di inviare!');
        return null;
      }

      let text = `*Disponibilità Turni TEPU*\n*Partecipante:* ${name}\n\n`;
      const days = getTurnDays();
      let selectedAny = false;

      days.forEach(day => {
        const checkboxes = document.querySelectorAll(`input[name="${day.id}"]:checked`);
        if (checkboxes.length > 0) {
          selectedAny = true;
          const choices = Array.from(checkboxes).map(cb => cb.value).join(', ');
          text += `📅 *${day.label}*: ${choices}\n`;
        }
      });

      if (!selectedAny) {
        alert('Seleziona almeno una disponibilità!');
        return null;
      }

      return text;
    }

    // Copia e avvisa per WhatsApp
    function sendWhatsApp() {
      const text = generateText();
      if (!text) return;

      navigator.clipboard.writeText(text).then(() => {
        alert('Testo copiato negli appunti!\nOra si aprirà WhatsApp: incolla il messaggio nella chat.');
        window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`, '_blank');
      }).catch(() => {
        window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`, '_blank');
      });
    }

    // Salva i dati localmente nel browser
    function saveLocally() {
      const name = document.getElementById('userName').value.trim();
      if (!name) {
        alert('Inserisci il tuo nome!');
        return;
      }

      const days = getTurnDays();
      const records = JSON.parse(localStorage.getItem('tepu_records') || '[]');

      days.forEach(day => {
        const checkboxes = document.querySelectorAll(`input[name="${day.id}"]:checked`);
        checkboxes.forEach(cb => {
          records.push({
            name: name,
            date: day.label,
            time: cb.value,
            timestamp: new Date().toISOString()
          });
        });
      });

      localStorage.setItem('tepu_records', JSON.stringify(records));
      alert('Disponibilità salvate sul dispositivo!');
      loadAdminTable();
    }

    // Gestione Trattino/Triplo Tocco per Admin
    let clickCount = 0;
    let clickTimer = null;

    document.getElementById('logo').addEventListener('click', () => {
      clickCount++;
      if (clickCount === 1) {
        clickTimer = setTimeout(() => { clickCount = 0; }, 1000);
      } else if (clickCount === 3) {
        clearTimeout(clickTimer);
        clickCount = 0;
        document.getElementById('loginModal').style.display = 'flex';
      }
    });

    function closeLoginModal() {
      document.getElementById('loginModal').style.display = 'none';
    }

    function checkAdminPassword() {
      const pass = document.getElementById('adminPassword').value;
      if (pass === 'admin123') {
        closeLoginModal();
        document.getElementById('adminSection').style.display = 'block';
        loadAdminTable();
        alert('Accesso amministratore effettuato!');
      } else {
        alert('Password errata!');
      }
    }

    function loadAdminTable() {
      const records = JSON.parse(localStorage.getItem('tepu_records') || '[]');
      const tbody = document.querySelector('#summaryTable tbody');
      tbody.innerHTML = records.map(r => `
        <tr>
          <td>${r.name}</td>
          <td>${r.date}</td>
          <td>${r.time}</td>
        </tr>
      `).join('');
    }

    function exportData() {
      const records = localStorage.getItem('tepu_records') || '[]';
      const blob = new Blob([records], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'disponibilita_tepu.json';
      a.click();
    }

    // Inizializzazione
    renderDays();
  </script>
</body>
</html>
